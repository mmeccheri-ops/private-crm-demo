<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private CRM 1.9.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#20334b;font:15px Arial,sans-serif}header{background:#172d4d;color:#fff;padding:22px}header h1{margin:0}header p{color:#d5deea}main{max-width:1080px;margin:auto;padding:16px}nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:8px;padding:10px 13px;background:#1c4778;color:#fff;cursor:pointer}nav button{background:#e2eaf3;color:#183b65}nav button.active{background:#183b65;color:white}.card{background:white;border:1px solid #dde5ef;border-radius:12px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{background:#eef3f9;padding:14px;border-radius:10px}.metric strong{display:block;font-size:21px;margin-top:8px}label{display:block;margin:12px 0 5px;font-weight:bold;font-size:13px}input,select,textarea{width:100%;border:1px solid #c9d4e2;border-radius:7px;padding:10px;font:inherit}textarea{min-height:70px}.item{padding:12px 0;border-bottom:1px solid #e8edf3}.muted{font-size:13px;color:#63758c}.warn{background:#fff1d5;border-radius:9px;padding:12px}h2{margin:0 0 12px;font-size:21px}h3{margin:16px 0 8px;font-size:16px}.pill{display:inline-block;padding:5px 9px;background:#e6edf6;border-radius:99px;font-size:12px}.bar{height:9px;background:#e4eaf1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#1c4778}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:1.2px;color:#61738d;margin-bottom:8px}.subnav{margin:3px 4px 3px 0;background:#e2eaf3;color:#183b65}.subnav:hover{background:#cbd9ea}@media print{header,nav,.warn,.noPrint{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0}#clientReport{display:block}} </style><style>

.report-brand{display:flex;align-items:center;gap:12px;letter-spacing:2px;font-size:14px}.report-brand small{display:block;font-size:9px;letter-spacing:1.4px;margin-top:6px;opacity:.7}.brand-mark{width:49px;height:49px;border:1px solid var(--premium-gold);display:grid;place-items:center;color:var(--premium-gold);font-family:Georgia,serif;font-size:21px;letter-spacing:0}
.cover-kicker,.report-kicker{font-size:10px;letter-spacing:2.5px;color:var(--premium-gold);font-weight:bold}.cover-body h1{font-family:Georgia,serif;font-weight:normal;font-size:48px;line-height:1.16;margin:18px 0}.cover-body p{color:#d4dde7;max-width:450px;line-height:1.7}.cover-rule{width:95px;height:2px;background:var(--premium-gold);margin:40px 0}.cover-body h2{font-size:22px;color:white}.cover-date,.cover-foot{font-size:12px;color:#d4dde7}
.report-content{padding:44px 52px}.report-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7dce4;padding-bottom:20px}.report-top .report-brand{color:var(--premium-navy)}.report-top>span{font-size:12px;color:#6b7788}.report-intro{padding:30px 0 8px}.report-intro h2{font-family:Georgia,serif;font-size:29px;font-weight:normal;color:var(--premium-navy)}.report-intro p,.report-section p{line-height:1.65;font-size:13px;color:#536275}.report-section{margin:23px 0 28px;break-inside:avoid;page-break-inside:avoid}.report-heading{display:flex;gap:15px;align-items:center;font-family:Georgia,serif;font-weight:normal;color:var(--premium-navy);font-size:21px;padding-bottom:10px;border-bottom:1px solid #d9e0e8}.report-heading span{font-family:Arial,sans-serif;font-size:12px;color:var(--premium-gold);font-weight:bold}.report-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.report-metric{background:#f2f4f6;padding:15px;min-height:90px}.report-metric span{font-size:12px;color:#657181;display:block}.report-metric strong{font-size:21px;display:block;margin-top:12px;color:var(--premium-navy)}.report-rows{display:grid;gap:0}.report-row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e7eaf0;padding:11px 0;font-size:13px}.report-row strong{text-align:right}.report-footnote{font-size:11px!important}.report-footer{border-top:1px solid #d7dce4;padding-top:14px;margin-top:40px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.6px;color:#64738a}

.agenda-entry{padding:10px 12px;margin:8px 0;background:#f4f7fb;border-left:3px solid #b8a37c;border-radius:5px}</style></head><body><header><h1>PRIVATE CRM <small>1.9.2</small></h1><p>Scheda cliente evoluta • Prototipo dimostrativo</p></header><main><div class="warn">DEMO PUBBLICA: usare solo dati fittizi. Il salvataggio è locale al browser; non esistono accessi riservati o permessi effettivi.</div><nav id="menu"></nav><section id="app"></section></main><script>
'use strict';
const tabs=['Clienti','Scheda cliente','Profilo','Patrimonio','Intervista','Approfondimenti','Polizze','Fabbisogno','Verbali','Attività','Diagnosi','Relazione','Obiettivi','Cruscotto','Agenda'];
const groups=[['Famiglia','Composizione del nucleo familiare?','Persone economicamente a carico?','Esigenze di tutela familiare?'],['Redditi','Reddito netto familiare annuo?','Spese familiari annue?','Riserva per imprevisti?'],['Patrimonio','Patrimonio finanziario complessivo?','Immobili posseduti?','Mutui o finanziamenti?'],['Previdenza','Pensione futura stimata?','Fondi pensione o PIP presenti?','Divario previdenziale valutato?'],['Protezione','Coperture caso morte esistenti?','Coperture invalidità e sanitarie?','Rischio non autosufficienza valutato?'],['Obiettivi','Obiettivi a breve termine?','Obiettivi a lungo termine?','Pianificazione successoria affrontata?']];
const fresh=n=>({name:n,job:'',family:'',assets:'',income:65000,years:8,debts:100000,liquid:80000,answers:{},notes:{},policies:[],meetings:[],tasks:[],profile:{}});
let db={clients:[fresh('Mario Rossi (demo)')],selected:0},tab=13;
try{let s=JSON.parse(localStorage.getItem('privateCRM19')||localStorage.getItem('privateCRM18')||localStorage.getItem('privateCRM17')||localStorage.getItem('privateCRM16')||localStorage.getItem('privateCRM15')||localStorage.getItem('privateCRM14')||localStorage.getItem('privateCRM13')||localStorage.getItem('privateCRM12')||localStorage.getItem('privateCRM11')||localStorage.getItem('privateCRM10')||localStorage.getItem('privateCRM09')||localStorage.getItem('privateCRM08')||localStorage.getItem('privateCRM07')||localStorage.getItem('privateCRM06')||localStorage.getItem('privateCRM05')||localStorage.getItem('privateCRM04')||'null');if(s&&Array.isArray(s.clients)&&s.clients.length)db=s}catch(e){}
const c=()=>db.clients[db.selected];const e=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const eur=x=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(x)||0);
const num=x=>Number(x)||0;const save=()=>{try{localStorage.setItem('privateCRM19',JSON.stringify(db))}catch(e){alert('Impossibile salvare nel browser')}};

// Recupero conservativo, solo su conferma esplicita. Nessun archivio precedente viene modificato.
function sourceArchives(){return ['18','17','16','15','14','13','12','11','10','09','08','07','06','05','04'].map(v=>{try{let d=JSON.parse(localStorage.getItem('privateCRM'+v)||'null');return d&&Array.isArray(d.clients)?{v,clients:d.clients}:null}catch(err){return null}}).filter(Boolean)}
function mergeMissing(target,source){
 const empty=v=>v===undefined||v===null||v==='';
 const clone=v=>JSON.parse(JSON.stringify(v));
 let added=0;
 for(const key of ['answers','notes','profile','cashflow']){
   if(source[key]&&typeof source[key]==='object'&&!Array.isArray(source[key])){
     if(!target[key]||typeof target[key]!=='object')target[key]={};
     for(const [k,v] of Object.entries(source[key]))if(empty(target[key][k])&&!empty(v)){target[key][k]=clone(v);added++}
   }
 }
 for(const key of ['policies','meetings','tasks','positions']){
   if(!Array.isArray(source[key]))continue;
   if(!Array.isArray(target[key]))target[key]=[];
   for(const item of source[key]){
     if(!target[key].some(existing=>JSON.stringify(existing)===JSON.stringify(item))){target[key].push(clone(item));added++}
   }
 }
 for(const [key,value] of Object.entries(source)){
   if(['answers','notes','profile','cashflow','policies','meetings','tasks','positions','name'].includes(key))continue;
   if(empty(target[key])&&!empty(value)){target[key]=clone(value);added++}
 }
 return added;
}
function recoverArchives(){
 const sources=sourceArchives();
 if(!sources.length)return alert('Non sono disponibili archivi precedenti in questo browser. Nessuna modifica effettuata.');
 if(!confirm('Recuperare le informazioni mancanti dagli archivi precedenti? I dati già presenti nella 1.7 hanno priorità. Prima verrà salvata una copia di sicurezza locale.'))return;
 try{
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  localStorage.setItem('privateCRM17_backup_'+stamp,JSON.stringify(db));
  let changes=0;
  for(const src of sources){for(const old of src.clients){
   if(!old||!old.name)continue;
   const match=db.clients.find(z=>String(z.name).trim().toLowerCase()===String(old.name).trim().toLowerCase());
   if(match)changes+=mergeMissing(match,old);
   else{db.clients.push(JSON.parse(JSON.stringify(old)));changes++}
  }}
  save();render();
  alert('Recupero completato. Elementi/campi aggiunti: '+changes+'. Verifica Polizze, Intervista e Relazione. Gli archivi precedenti non sono stati modificati.');
 }catch(err){alert('Recupero interrotto: '+err.message+'. Gli archivi precedenti restano invariati.')}
}
function exportBackup(){
 const payload={exportedAt:new Date().toISOString(),version:'1.9',db,previousArchives:sourceArchives()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='private-crm-v17-backup-'+localToday()+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}
let pendingImport=null;
function validateArchive(value){
 if(!value||typeof value!=='object'||Array.isArray(value)||!Array.isArray(value.clients)||!value.clients.length||value.clients.length>1000)throw Error('Archivio non valido o senza clienti.');
 for(const client of value.clients){
  if(!client||typeof client!=='object'||Array.isArray(client)||typeof client.name!=='string'||!client.name.trim())throw Error('Scheda cliente non valida.');
  for(const k of ['policies','meetings','tasks','positions'])if(client[k]!==undefined&&!Array.isArray(client[k]))throw Error('Campo '+k+' non valido.');
  for(const k of ['answers','notes','profile','cashflow'])if(client[k]!==undefined&&(client[k]===null||typeof client[k]!=='object'||Array.isArray(client[k])))throw Error('Campo '+k+' non valido.');
 }
 return {clients:value.clients,selected:Number.isInteger(value.selected)&&value.selected>=0&&value.selected<value.clients.length?value.selected:0};
}
function archiveStats(value){
 const count=k=>value.clients.reduce((sum,cl)=>sum+(Array.isArray(cl[k])?cl[k].length:0),0);
 return value.clients.length+' clienti, '+count('policies')+' polizze, '+count('positions')+' posizioni patrimoniali, '+count('meetings')+' verbali, '+count('tasks')+' attività';
}
async function previewImport(input){
 pendingImport=null;
 const target=document.getElementById('importPreview'),button=document.getElementById('importButton');button.disabled=true;
 if(!input.files||!input.files[0]){target.textContent='Nessun file selezionato.';return}
 try{
  const file=input.files[0];if(file.size>5*1024*1024)throw Error('File troppo grande (massimo 5 MB).');
  const data=JSON.parse(await file.text());
  const parsed=validateArchive(data.db||data);
  pendingImport=parsed;
  target.textContent='Backup selezionato: '+file.name+' — '+archiveStats(parsed)+'. Il ripristino sostituirà l’archivio attivo 1.9, non gli archivi precedenti.';
  button.disabled=false;
 }catch(err){target.textContent='Impossibile utilizzare questo file: '+err.message}
}
function restoreImport(){
 if(!pendingImport)return alert('Seleziona prima un backup JSON valido.');
 if(!confirm('Hai già esportato e conservato il backup dell’archivio attuale 0.9? Il ripristino SOSTITUIRÀ i dati attivi con quelli del file selezionato. Annulla se non hai salvato il backup.'))return;
 if(!confirm('Ultima conferma: sostituire l’archivio attivo 1.9 con '+archiveStats(pendingImport)+'?'))return;
 try{
  const original=JSON.stringify(db),incoming=JSON.stringify(pendingImport);
  const key='privateCRM19_preimport_'+new Date().toISOString().replace(/[:.]/g,'-');
  localStorage.setItem(key,original);
  localStorage.setItem('privateCRM19',incoming);
  db=JSON.parse(incoming);pendingImport=null;tab=0;render();
  alert('Ripristino completato. Verifica ora Polizze, Intervista e Patrimonio. La copia precedente è conservata nel browser, ma mantieni anche il backup JSON scaricato.');
 }catch(err){alert('Ripristino non eseguito: '+err.message+'. Controlla lo spazio disponibile nel browser.');}
}
const done=()=>Object.values(c().answers||{}).filter(x=>x&&x!=='Da esaminare').length;
const tcm=()=>c().policies.filter(p=>p.type==='Temporanea caso morte'&&p.status==='Documentata').reduce((a,p)=>a+num(p.amount),0);
const profile=()=>c().profile||(c().profile={});
const pf=(label,key,type='text')=>'<label>'+label+'</label><input data-profile="'+key+'" type="'+type+'" value="'+e(profile()[key]||'')+'">';
const cf=(label,key,type='text')=>'<label>'+label+'</label><input data-client="'+key+'" type="'+type+'" value="'+e(c()[key]??'')+'">';
function go(i){if(i===2)i=1;tab=i;render();window.scrollTo(0,0)}
function openDashboardClient(ci,dest){db.selected=ci;save();go(dest)}
function choose(i){db.selected=i;save();go(1)}
function addClient(){let n=document.getElementById('newname').value.trim();if(!n)return alert('Inserisci un nome fittizio');db.clients.push(fresh(n));db.selected=db.clients.length-1;save();go(1)}
function addPolicy(){let p={type:document.getElementById('ptype').value,company:document.getElementById('pcompany').value,amount:document.getElementById('pamount').value,status:document.getElementById('pstatus').value};if(!p.company.trim())return alert('Inserisci la compagnia');c().policies.push(p);save();render()}
function delPolicy(i){c().policies.splice(i,1);save();render()}
function addMeeting(){let x=document.getElementById('mtext').value.trim();if(!x)return alert('Inserisci le note');c().meetings.push({type:document.getElementById('mtype').value,text:x,date:document.getElementById('mdate').value||localToday(),visibility:document.getElementById('mvis').value,followup:document.getElementById('mfollow').value.trim()});save();render()}
function addTask(){let x=document.getElementById('tasktext').value.trim();if(!x)return alert('Inserisci una descrizione');c().tasks.push({text:x,owner:document.getElementById('owner').value,done:false,due:document.getElementById('taskdue').value,priority:document.getElementById('taskpriority').value});save();render()}
function toggle(i){c().tasks[i].done=!c().tasks[i].done;save();render()}
function addGoal(){let label=document.getElementById('goalname').value.trim();if(!label)return alert('Inserisci un obiettivo');let amount=document.getElementById('goaltarget').value,progress=document.getElementById('goalcurrent').value;if((amount!==''&&num(amount)<0)||(progress!==''&&num(progress)<0))return alert('Gli importi non possono essere negativi');c().goalsV16||=[];c().goalsV16.push({label,area:document.getElementById('goalarea').value,target:amount===''?null:num(amount),current:progress===''?null:num(progress),due:document.getElementById('goaldate').value,status:'In corso'});save();render()}
function goalStatus(i,v){c().goalsV16[i].status=v;save();render()}
function deleteGoal(i){if(!confirm('Eliminare questo obiettivo dimostrativo?'))return;c().goalsV16.splice(i,1);save();render()}
const dateLabel=v=>{if(!v)return 'Senza scadenza';let m=String(v).match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(v)};


function addPosition(){let p={group:document.getElementById('posgroup').value,label:document.getElementById('poslabel').value.trim(),amount:document.getElementById('posamount').value,owner:document.getElementById('posowner').value.trim(),date:document.getElementById('posdate').value,status:document.getElementById('posstatus').value,notes:document.getElementById('posnotes').value};if(!p.label||!p.amount||num(p.amount)<0)return alert('Inserisci descrizione e importo positivo');c().positions||=[];c().positions.push(p);save();render()}
function removePosition(i){if(!confirm('Eliminare questa posizione dimostrativa?'))return;c().positions.splice(i,1);save();render()}
function syncProfile(){let z={fin:0,imm:0,other:0,debt:0};(c().positions||[]).forEach(p=>{if(Object.hasOwn(z,p.group))z[p.group]+=num(p.amount)});if(!confirm('Sostituire i totali del profilo con quelli delle posizioni analitiche?'))return;profile().financial=z.fin+z.other;profile().properties=z.imm;c().debts=z.debt;save();alert('Totali del profilo aggiornati. Verifica eventuali altri beni inclusi nel totale finanziario.');go(1)}

function diagnostic(){
 let x=c(),p=profile(),pos=x.positions||[],s={fin:0,imm:0,other:0,debt:0};
 pos.forEach(q=>{if(Object.prototype.hasOwnProperty.call(s,q.group))s[q.group]+=num(q.amount)});
 let hasPos=pos.length>0,assets=s.fin+s.imm+s.other,net=assets-s.debt;
 let f=x.cashflow||{},hasFlow=f.income!==undefined&&f.income!==''&&f.expenses!==undefined&&f.expenses!=='';
 let savings=hasFlow?num(f.income)-num(f.expenses):null;
 let pending=groups.flatMap((g,i)=>g.slice(1).map((q,j)=>({area:g[0],question:q,key:i+'-'+j}))).filter(q=>(x.answers||{})[q.key]==='Da approfondire');
 let unverified=pos.filter(q=>q.status!=='Documentato');
 let pendingTasks=(x.tasks||[]).filter(q=>!q.done);
 let need=Math.max(0,num(x.income)*num(x.years)+num(x.debts)-num(x.liquid));
 return {x,p,pos,s,hasPos,assets,net,f,hasFlow,savings,pending,unverified,pendingTasks,need,gap:Math.max(0,need-tcm())};
}
let reportMode='client';
const reportLine=(label,value)=>'<div class="report-row"><span>'+e(label)+'</span><strong>'+e(value)+'</strong></div>';
function reportHtml(){
 const d=diagnostic(),x=d.x,p=d.p,dt=new Date().toLocaleDateString('it-IT');
 const has=(v)=>v!==undefined&&v!==null&&String(v).trim()!=='';
 const metric=(label,value)=>'<div class="report-metric"><span>'+e(label)+'</span><strong>'+e(value)+'</strong></div>';
 const heading=(n,t)=>'<h3 class="report-heading"><span>'+n+'</span>'+t+'</h3>';
 const brand='<div class="report-brand"><span class="brand-mark">MM</span><span><b>MARCO MECCHERI</b><small>PERSONAL FINANCIAL ADVISOR</small></span></div>';
 let cover='<section class="report-cover">'+brand+'<div class="cover-body"><div class="cover-kicker">DOCUMENTO CONOSCITIVO · RISERVATO</div><h1>La tua situazione<br>patrimoniale</h1><p>Una visione d’insieme di patrimonio, protezione e pianificazione</p><div class="cover-rule"></div><h2>'+e(x.name)+'</h2><div class="cover-date">'+dt+'</div></div><div class="cover-foot">Documento dimostrativo · Solo dati fittizi</div></section>';

 let summary='<section class="report-section">'+heading('01','Sintesi patrimoniale')+'<div class="report-metrics">'+metric('Attività censite',d.hasPos?eur(d.assets):'N/D')+metric('Passività censite',d.hasPos?eur(d.s.debt):'N/D')+metric('Netto censito',d.hasPos?eur(d.net):'N/D')+'</div><p class="report-footnote">Il netto censito può essere parziale. I valori analitici non vengono sommati ai totali generici del profilo.</p></section>';
